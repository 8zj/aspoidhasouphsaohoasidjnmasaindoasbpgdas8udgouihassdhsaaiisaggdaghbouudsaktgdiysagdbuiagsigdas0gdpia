name: Discord Repository Updates

on:
  push:
    branches:
      - main

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for commit stats)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Discord Notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          ACTOR: ${{ github.actor }}
          ACTOR_URL: ${{ github.event.sender.html_url }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMPARE_URL: ${{ github.event.compare }}
          AVATAR: ${{ github.event.sender.avatar_url }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_COUNT: ${{ github.event.commits && github.event.commits[0] && '' || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          webhook = os.environ["WEBHOOK"]

          commit_message = os.environ.get("COMMIT_MESSAGE", "No commit message").strip()
          title_line, *rest_lines = commit_message.splitlines() or [""]
          commit_body = "\n".join(rest_lines).strip()

          if len(title_line) > 256:
              title_line = title_line[:253] + "..."
          if len(commit_body) > 900:
              commit_body = commit_body[:897] + "..."

          sha = os.environ["COMMIT_SHA"][:7]

          # Try to get diff stats for the pushed commit
          files_changed = additions = deletions = None
          try:
              out = subprocess.run(
                  ["git", "diff", "--shortstat", "HEAD~1", "HEAD"],
                  capture_output=True, text=True, check=True
              ).stdout.strip()
              # e.g. " 3 files changed, 45 insertions(+), 12 deletions(-)"
              import re
              m_files = re.search(r"(\d+) files? changed", out)
              m_add = re.search(r"(\d+) insertions?\(\+\)", out)
              m_del = re.search(r"(\d+) deletions?\(-\)", out)
              files_changed = m_files.group(1) if m_files else "0"
              additions = m_add.group(1) if m_add else "0"
              deletions = m_del.group(1) if m_del else "0"
          except Exception:
              pass

          fields = [
              {
                  "name": "👤 Author",
                  "value": f"[{os.environ['ACTOR']}]({os.environ.get('ACTOR_URL', '')})",
                  "inline": True
              },
              {
                  "name": "🌿 Branch",
                  "value": f"`{os.environ['BRANCH']}`",
                  "inline": True
              },
              {
                  "name": "🔖 Commit",
                  "value": f"[`{sha}`]({os.environ['COMMIT_URL']})",
                  "inline": True
              },
          ]

          if files_changed is not None:
              fields.append({
                  "name": "📊 Changes",
                  "value": f"📁 `{files_changed}` files  •  🟢 `+{additions}`  •  🔴 `-{deletions}`",
                  "inline": False
              })

          fields.append({
              "name": "📝 Commit Message",
              "value": f"**{title_line}**" + (f"\n```text\n{commit_body}\n```" if commit_body else ""),
              "inline": False
          })

          if os.environ.get("COMPARE_URL"):
              fields.append({
                  "name": "🔍 Compare",
                  "value": f"[View full diff]({os.environ['COMPARE_URL']})",
                  "inline": False
              })

          payload = {
              "username": "GitHub Updates",
              "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "embeds": [
                  {
                      "author": {
                          "name": os.environ["REPO"],
                          "url": f"https://github.com/{os.environ['REPO']}",
                          "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                      },
                      "title": "✨ New push to repository",
                      "url": os.environ["COMMIT_URL"],
                      "color": 5793266,
                      "thumbnail": {
                          "url": os.environ["AVATAR"]
                      },
                      "fields": fields,
                      "footer": {
                          "text": f"GitHub • {os.environ['REPO']}",
                          "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                      },
                      "timestamp": os.environ.get("COMMIT_TIMESTAMP", "")
                  }
              ],
              "components": [
                  {
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "View Commit",
                              "url": os.environ["COMMIT_URL"]
                          },
                          {
                              "type": 2,
                              "style": 5,
                              "label": "View Repository",
                              "url": f"https://github.com/{os.environ['REPO']}"
                          },
                          {
                              "type": 2,
                              "style": 5,
                              "label": "Workflow Run",
                              "url": os.environ["RUN_URL"]
                          }
                      ]
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Discord-Webhook"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord webhook response: {response.status}")
          PY
